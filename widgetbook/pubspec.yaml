name: widgetbook_workspace
description: Widgetbook catalog for the List Whatever app — preview views and pages in isolation.
publish_to: "none"
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.22.0
  widgetbook_annotation: ^3.11.0
  flutter_bloc: ^9.1.0
  go_router: ^17.0.0
  device_frame_plus: ^1.5.0

  listwhatever:
    path: ../apps/app
  core_models:
    path: ../packages/core_models

  anyhoo_design_system:
    git:
      url: https://github.com/Anyhoosolutions/flutter_platform_kit.git
      path: packages/anyhoo_design_system
      ref: 97554aa8c8c468eb824eddfa6bd09fdbece2aea8

  anyhoo_core:
    git:
      url: https://github.com/Anyhoosolutions/flutter_platform_kit.git
      path: packages/anyhoo_core
      ref: 97554aa8c8c468eb824eddfa6bd09fdbece2aea8
  anyhoo_auth:
    git:
      url: https://github.com/Anyhoosolutions/flutter_platform_kit.git
      path: packages/anyhoo_auth
      ref: 97554aa8c8c468eb824eddfa6bd09fdbece2aea8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.22.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
