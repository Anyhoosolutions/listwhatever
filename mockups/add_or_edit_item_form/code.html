<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add or Edit Item Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-white min-h-screen flex justify-center">
<div class="relative flex min-h-screen w-full max-w-[480px] flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-white/10">
<div class="text-primary flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Add New Item</h2>
<div class="flex w-12 items-center justify-end cursor-pointer">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0">Save</p>
</div>
</header>
<main class="flex-1 pb-10">
<!-- General Info Section -->
<div class="px-4 pt-6">
<!-- TextField: Item Name -->
<div class="flex flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Item Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-none bg-white dark:bg-[#283039] h-14 placeholder:text-gray-400 dark:placeholder:text-[#9dabb9] p-4 text-base font-normal leading-normal shadow-sm" placeholder="Enter item name..." type="text" value=""/>
</label>
</div>
<!-- TextField: Description -->
<div class="flex flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Description</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-none bg-white dark:bg-[#283039] min-h-32 placeholder:text-gray-400 dark:placeholder:text-[#9dabb9] p-4 text-base font-normal leading-normal shadow-sm" placeholder="Add details..."></textarea>
</label>
</div>
</div>
<!-- Categories Section Header -->
<div class="mt-4">
<h3 class="text-gray-900 dark:text-white text-sm font-bold leading-tight tracking-wider px-4 pb-2 pt-4 uppercase opacity-60">Categories</h3>
<p class="text-gray-600 dark:text-[#9dabb9] text-sm font-normal leading-normal pb-3 pt-1 px-4">Add custom attributes like Genre or Status.</p>
</div>
<!-- Dynamic Category List -->
<div class="px-4 space-y-3">
<!-- Category Row 1 -->
<div class="flex gap-2 items-center">
<input class="form-input flex-1 rounded-lg border-none bg-white dark:bg-[#283039] text-gray-900 dark:text-white h-12 p-3 text-sm placeholder:text-gray-400 dark:placeholder:text-[#9dabb9]" placeholder="Attribute (e.g. Genre)" type="text"/>
<span class="text-gray-400">:</span>
<input class="form-input flex-1 rounded-lg border-none bg-white dark:bg-[#283039] text-gray-900 dark:text-white h-12 p-3 text-sm placeholder:text-gray-400 dark:placeholder:text-[#9dabb9]" placeholder="Value (e.g. Drama)" type="text"/>
<button class="text-gray-400 hover:text-red-500 transition-colors p-1">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Category Row 2 (Preset Example) -->
<div class="flex gap-2 items-center">
<input class="form-input flex-1 rounded-lg border-none bg-white dark:bg-[#283039] text-gray-900 dark:text-white h-12 p-3 text-sm" type="text" value="Status"/>
<span class="text-gray-400">:</span>
<input class="form-input flex-1 rounded-lg border-none bg-white dark:bg-[#283039] text-gray-900 dark:text-white h-12 p-3 text-sm" type="text" value="In Progress"/>
<button class="text-gray-400 hover:text-red-500 transition-colors p-1">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Add Category Button -->
<button class="flex items-center gap-2 text-primary font-medium py-2 px-1 text-sm mt-2 active:opacity-60">
<span class="material-symbols-outlined text-xl">add_circle</span>
<span>Add New Category</span>
</button>
</div>
<!-- Location Section Header -->
<div class="mt-8">
<h3 class="text-gray-900 dark:text-white text-sm font-bold leading-tight tracking-wider px-4 pb-2 pt-4 uppercase opacity-60">Location</h3>
</div>
<!-- Location Picker Section -->
<div class="px-4 pb-8 space-y-4">
<!-- Map Preview -->
<div class="relative w-full h-48 rounded-xl overflow-hidden bg-gray-200 dark:bg-[#1c242c] shadow-inner group cursor-pointer border border-white/5">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&amp;w=800&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-60 dark:opacity-40 grayscale-[0.5]" data-alt="Map view of a city street layout"></div>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-primary text-5xl drop-shadow-lg" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="absolute bottom-3 right-3 bg-white/90 dark:bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase text-gray-900 dark:text-white border border-white/10">
                        Tap to set
                    </div>
</div>
<!-- Coordinates -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<p class="text-xs font-semibold text-gray-500 dark:text-[#9dabb9] uppercase px-1">Latitude</p>
<div class="bg-white dark:bg-[#283039] rounded-lg h-12 flex items-center px-4 text-sm text-gray-900 dark:text-white border border-transparent shadow-sm">
                            34.0522° N
                        </div>
</div>
<div class="flex flex-col gap-1.5">
<p class="text-xs font-semibold text-gray-500 dark:text-[#9dabb9] uppercase px-1">Longitude</p>
<div class="bg-white dark:bg-[#283039] rounded-lg h-12 flex items-center px-4 text-sm text-gray-900 dark:text-white border border-transparent shadow-sm">
                            118.2437° W
                        </div>
</div>
</div>
<button class="w-full bg-primary/10 dark:bg-primary/20 hover:bg-primary/20 dark:hover:bg-primary/30 text-primary py-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 border border-primary/20 active:scale-[0.98]">
<span class="material-symbols-outlined text-lg">my_location</span>
                    Use My Current Location
                </button>
</div>
</main>
<!-- Footer Action (iOS Style) -->
<footer class="p-6 pt-2 bg-background-light dark:bg-background-dark">
<button class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                Create Item
            </button>
</footer>
</div>
</body></html>
